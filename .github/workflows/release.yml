name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  # The full OS matrix must pass before anything is published.
  check:
    uses: ./.github/workflows/ci.yml

  # Builds dist/ in a job that has no publish credentials, so dependency install scripts
  # never run next to the OIDC token.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.21.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish a prerelease from main
        if: github.ref_type == 'branch'
        run: |
          BASE="$(node -p "require('./package.json').version")"
          npm version "${BASE}-next.${{ github.run_number }}" --no-git-tag-version --ignore-scripts
          npm publish --tag next --ignore-scripts

      - name: Publish a release from a tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "Tag ${TAG} does not match package.json version v${VERSION}" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit ${GITHUB_SHA} is not on main" >&2
            exit 1
          fi
          case "$VERSION" in
            *-*) npm publish --tag next --ignore-scripts ;;
            *) npm publish --ignore-scripts ;;
          esac

  # Runs install.sh for real on each OS, against what was just published, before a release carries it.
  installer:
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    needs: publish
    uses: ./.github/workflows/installer.yml

  # A stable release's GitHub Release carries install.sh: the installation line downloads it from
  # releases/latest. Nothing is installed here, next to a token that can write the repository.
  github-release:
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    needs: [publish, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the GitHub Release with install.sh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" install.sh --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes "What changed: https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/changelog.mdx"
